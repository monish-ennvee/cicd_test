name: Deploy NetSuite SDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate SDF Project
    runs-on: ubuntu-latest
    env:
      SUITECLOUD_CLI_ACCEPT_LICENSE: "true"
      SUITECLOUD_CI: "1"
      SUITECLOUD_CI_PASSKEY: ${{ secrets.SUITECLOUD_CI_PASSKEY }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install SDF
        run: npm install -g @oracle/suitecloud-cli

      - name: Validate Project CLI
        run:
          | 
          suitecloud project:validate --applyinstallprefs
          echo "Completed" 